# Publishes prebuilt binaries to a GitHub release when a `v*` tag is pushed.
# Each archive is attested, and described by a signed packslip manifest
# (packslip.sigstore.json), both of which mise verifies on install.
# Asset names follow `jj-gh-<target-triple>.<ext>`, which mise's `github:`
# backend (and ubi) pick up automatically:
#
#   mise use -g github:andrewaylett/jj-gh
name: Release

on:
  push:
    tags: ["v[0-9]+.*"]

permissions: {}

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - name: Check tag matches Cargo.toml
      run: |
        version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
        [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != Cargo.toml v$version"; exit 1; }
    - name: Create release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME" || true

  upload-assets:
    needs: create-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
        - target: x86_64-unknown-linux-musl
          os: ubuntu-latest
        - target: aarch64-unknown-linux-musl
          os: ubuntu-latest
        - target: x86_64-apple-darwin
          os: macos-latest
        - target: aarch64-apple-darwin
          os: macos-latest
        - target: x86_64-pc-windows-msvc
          os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
      id: upload
      with:
        bin: jj-gh
        target: ${{ matrix.target }}
        archive: jj-gh-$target
        checksum: sha256
        include: README.md,LICENSE-MIT
        token: ${{ secrets.GITHUB_TOKEN }}
    # mise's github backend verifies GitHub artifact attestations when
    # present; the subject digest must match the uploaded archive.
    - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
      with:
        subject-path: ${{ steps.upload.outputs.tar || steps.upload.outputs.zip }}

  # Signs a manifest describing the uploaded archives so that mise's packslip
  # backend can verify them. The signing job only reads the release; a
  # separate job holds `contents: write` to attach the bundle. Archives were
  # already attested above, so the manifest just links to those attestations.
  packslip:
    needs: upload-assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: jdx/packslip@2187c31f8317b8548833baf60cfe93db1f42431d # v1.9.0
      id: packslip
      with:
        download: jj-gh-*.tar.gz jj-gh-*.zip
        bin: jj-gh
        attest: link
        upload: false
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: packslip-bundle
        path: ${{ steps.packslip.outputs.bundle }}
        if-no-files-found: error

  publish-packslip:
    needs: packslip
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: packslip-bundle
        path: packslip
    - name: Upload the signed bundle
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        test -f packslip/packslip.sigstore.json
        gh release upload "$GITHUB_REF_NAME" packslip/packslip.sigstore.json \
          --repo "$GITHUB_REPOSITORY" --clobber
