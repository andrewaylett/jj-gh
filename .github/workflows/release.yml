# Publishes prebuilt binaries to a GitHub release when a `v*` tag is pushed.
# Asset names follow `jj-gh-<target-triple>.<ext>`, which mise's `github:`
# backend (and ubi) pick up automatically:
#
#   mise use -g github:andrewaylett/jj-gh
name: Release

on:
  push:
    tags: ["v[0-9]+.*"]

permissions: {}

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - name: Check tag matches Cargo.toml
      run: |
        version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
        [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != Cargo.toml v$version"; exit 1; }
    - name: Create release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME" || true

  upload-assets:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
        - target: x86_64-unknown-linux-musl
          os: ubuntu-latest
        - target: aarch64-unknown-linux-musl
          os: ubuntu-latest
        - target: x86_64-apple-darwin
          os: macos-latest
        - target: aarch64-apple-darwin
          os: macos-latest
        - target: x86_64-pc-windows-msvc
          os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
      with:
        bin: jj-gh
        target: ${{ matrix.target }}
        archive: jj-gh-$target
        checksum: sha256
        include: README.md,LICENSE-MIT
        token: ${{ secrets.GITHUB_TOKEN }}
