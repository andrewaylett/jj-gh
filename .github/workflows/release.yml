# Publishes prebuilt binaries to a GitHub release when a `v*` tag is pushed.
# Each archive is attested, and described by a signed packslip manifest
# (packslip.sigstore.json), both of which mise verifies on install.
# Asset names follow `jj-gh-<target-triple>.<ext>`, which mise's `github:`
# backend (and ubi) pick up automatically:
#
#   mise use -g packslip:andrewaylett/jj-gh
name: Release

on:
  push:
    tags: ["v[0-9]+.*"]

permissions: {}

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Check tag is a semver version
      run: |
        [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH[-PRERELEASE]"; exit 1; }
    - name: Create release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME" || true

  upload-assets:
    needs: create-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
        - target: x86_64-unknown-linux-musl
          os: ubuntu-latest
        - target: aarch64-unknown-linux-musl
          os: ubuntu-latest
        - target: x86_64-apple-darwin
          os: macos-latest
        - target: aarch64-apple-darwin
          os: macos-latest
        - target: x86_64-pc-windows-msvc
          os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    # The tag is the source of truth for the version; Cargo.toml holds a
    # placeholder. Cargo.lock is refreshed by the build.
    - name: Set version from tag
      shell: bash
      run: |
        export VERSION="${GITHUB_REF_NAME#v}"
        perl -pi -e 's/^version = ".*?"/version = "$ENV{VERSION}"/ if /^version = / && !$done++' Cargo.toml
        grep -m1 "^version = \"$VERSION\"" Cargo.toml
    - uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
      id: upload
      with:
        bin: jj-gh
        target: ${{ matrix.target }}
        archive: jj-gh-$target
        checksum: sha256
        include: README.md,LICENSE-MIT
        token: ${{ secrets.GITHUB_TOKEN }}
    # mise's github backend verifies GitHub artifact attestations when
    # present; the subject digest must match the uploaded archive.
    - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: ${{ steps.upload.outputs.tar || steps.upload.outputs.zip }}

  # Signs a manifest describing the uploaded archives so that mise's packslip
  # backend can verify them. The signing job only reads the release; a
  # separate job holds `contents: write` to attach the bundle. Archives were
  # already attested above, so the manifest just links to those attestations.
  packslip:
    needs: upload-assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: jdx/packslip@ddcddd9c8c33977d2d08d5db91caec579da59aab # v1.11.0
      id: packslip
      with:
        download: jj-gh-*.tar.gz jj-gh-*.zip
        bin: jj-gh
        # Consumers generate completions by running the shipped binary, so
        # nothing extra needs to go in the archives.
        resources: |
          completion/bash,zsh,fish=exec:jj-gh completions {shell}
        attest: link
        upload: false
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: packslip-bundle
        path: ${{ steps.packslip.outputs.bundle }}
        if-no-files-found: error

  publish-packslip:
    needs: packslip
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: packslip-bundle
        path: packslip
    - name: Upload the signed bundle
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        test -f packslip/packslip.sigstore.json
        gh release upload "$GITHUB_REF_NAME" packslip/packslip.sigstore.json \
          --repo "$GITHUB_REPOSITORY" --clobber
