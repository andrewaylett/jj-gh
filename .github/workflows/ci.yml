name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      with:
        components: clippy, rustfmt
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
    - name: Install jj and git identity
      uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
      with:
        install_args: jj
    # The mise shim only resolves a version inside a mise-configured
    # directory, but the e2e tests run jj from a temp dir.
    - name: Put the real jj on PATH
      shell: bash
      run: dirname "$(mise which jj)" >> "$GITHUB_PATH"
    - run: git config --global user.name ci && git config --global user.email ci@example.com
    - run: cargo fmt --check
    - run: cargo clippy --all-targets -- -D warnings
    - run: cargo test
