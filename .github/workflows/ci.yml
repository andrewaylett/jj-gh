name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install jj and git identity
        uses: jdx/mise-action@v2
        with:
          install_args: jj
      # The mise shim only resolves a version inside a mise-configured
      # directory, but the e2e tests run jj from a temp dir.
      - name: Put the real jj on PATH
        shell: bash
        run: dirname "$(mise which jj)" >> "$GITHUB_PATH"
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
